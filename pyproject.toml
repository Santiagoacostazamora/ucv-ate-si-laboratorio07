[tool.poetry]
name = "ucv-lab07"
version = "0.1.0"
description = "Laboratorio profesional de procesamiento de imágenes con Kedro, Poetry, GitHub Actions y SonarQube"
authors = ["Santiagoacostazamora <oacostaz@ucvvirtual.edu.pe>"]
readme = "README.md"
packages = [{ include = "si_image_processing", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
kedro = "^0.19.0"
kedro-datasets = "^3.0.0"
pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.kedro]
package_name = "si_image_processing"
project_name = "ucv-lab07"
kedro_init_version = "0.19.0"
tools = []
example_pipeline = "False"
source_dir = "src"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.kedro_telemetry]
project_id = "b7816d0684744dc4a4bac7b3f6f34cd7"
